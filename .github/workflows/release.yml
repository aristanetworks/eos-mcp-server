name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Required for npm trusted publishing (OIDC) and provenance
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Package
        run: npm pack

      - name: Smoke-test artifact
        run: |
          tar xzf aristanetworks-eos-mcp-server-*.tgz
          node package/dist/index.js --version

      - name: Publish to npm
        run: |
          tarball=$(ls aristanetworks-eos-mcp-server-*.tgz)
          if [[ "$GITHUB_REF_NAME" =~ -(alpha|beta|rc) ]]; then
            npm publish "$tarball" --tag next
          else
            npm publish "$tarball"
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: aristanetworks-eos-mcp-server-*.tgz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
