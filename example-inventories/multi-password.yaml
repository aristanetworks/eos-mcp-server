# Canonical inventory with a different password for every device.
#
# Keep passwords out of the inventory. Each mcp_password_env value is the name
# of an environment variable that must be set before starting the server.
# The variable names use the default allowed EOS_MCP_ prefix.
all:
  children:
    FABRIC:
      vars:
        ansible_user: admin
        ansible_network_os: eos
        mcp_validate_certs: false
      hosts:
        spine1:
          ansible_host: 192.0.2.11
          mcp_password_env: EOS_MCP_SPINE1_PASSWORD
        spine2:
          ansible_host: 192.0.2.12
          mcp_password_env: EOS_MCP_SPINE2_PASSWORD
        leaf1:
          ansible_host: 192.0.2.21
          mcp_password_env: EOS_MCP_LEAF1_PASSWORD
        leaf2:
          ansible_host: 192.0.2.22
          mcp_password_env: EOS_MCP_LEAF2_PASSWORD

      children:
        SPINES:
          hosts:
            spine1:
            spine2:
        LEAFS:
          hosts:
            leaf1:
            leaf2:
