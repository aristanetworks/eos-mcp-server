# Canonical Ansible-style inventory for eos-mcp-server.
#
# The addresses below use RFC 5737 TEST-NET space and are placeholders.
# Replace hostnames, addresses, and certificate policy for your environment.
all:
  children:
    FABRIC:
      vars:
        ansible_user: admin
        ansible_network_os: eos
        mcp_password_env: EOS_MCP_PASSWORD
        # Useful for labs with self-signed eAPI certificates. Prefer a CA bundle
        # and certificate validation in production.
        mcp_validate_certs: false
      children:
        SPINES:
          hosts:
            spine1:
              ansible_host: 192.0.2.11
            spine2:
              ansible_host: 192.0.2.12
        LEAFS:
          children:
            LEAF_PAIR_1:
              hosts:
                leaf1:
                  ansible_host: 192.0.2.21
                leaf2:
                  ansible_host: 192.0.2.22
            LEAF_PAIR_2:
              hosts:
                leaf3:
                  ansible_host: 192.0.2.23
                leaf4:
                  ansible_host: 192.0.2.24

    # These groups intentionally reuse canonical groups defined above. The server
    # merges repeated group definitions and treats the inventory as authoritative.
    NETWORK_SERVICES:
      children:
        LEAFS:

    CONNECTED_ENDPOINTS:
      children:
        LEAFS:
